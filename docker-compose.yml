services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: churn
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: churn
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U churn -d churn"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
